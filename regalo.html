<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il regalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap">

<body>

<header class="topbar"><div class="topbar-in">
  <a class="logo" href="index.html"><span class="dot" aria-hidden="true"></span><b>Auguri Ele</b></a>
</div></header>

<main>
<section id="regalo" class="tint-violet" style="border-top:0"><div class="wrap">
  <div class="gift">
    <span class="eyebrow">La sorpresa</span>
    <h2>Cosa c'è nel pacco?</h2>
    <div class="clues">
      <div class="clue">Fa un sacco de vento, ma nun è novembre.</div>
      <div class="clue">Costa 'na cifra… ma te cambia la piega (e la vita).</div>
      <div class="clue">Da oggi asciugarsi i capelli è un lusso.</div>
    </div>
    <div class="guesses" id="guesses">
      <button type="button">Una piastra</button>
      <button type="button" data-correct="1">Un phon Dyson</button>
      <button type="button">Un ventilatore</button>
      <button type="button">Un peluche</button>
    </div>
    <div class="gift-fb" id="giftFb"></div>
    <div class="reveal" id="giftReveal">
      <div class="big">È un phon <span class="name">DYSON</span></div>
      <p>Auguri dottoressa: da oggi la piega perfetta è un tuo diritto.</p>
      <div class="next-wrap" style="margin-top:22px"><a class="next pink" href="auguri.html">Vai al biglietto →</a></div>
    </div>
  </div>
</div></section>
</main>

<footer><div class="wrap foot-in">
  <div>Auguri Ele · <span data-site="citta">Pisa</span></div>
</div></footer>

<script src="assets/app.js"></script>
</body>
